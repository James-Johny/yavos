<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#05125e">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual - SAVOY</title>
    
    <!-- Bibliotecas externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- ========================================== -->
    <!-- 1. TELA DE LOGIN (Visível inicialmente)    -->
    <!-- ========================================== -->
    <!--<div id="login" class="login">
        <span id="savoy">SAVOY</span>
        <span class="title-login">Bem vindo(a)</span>
        <input type="text" id="matricula" placeholder="Digite sua matrícula">
        <button onclick="login()" id="btn-matricula">Entrar</button>
        <div id="mensagemErro"></div>
    </div> -->

    <!-- ========================================== -->
    <!-- 2. JANELA DO CHAT (Ocupa a tela após login)-->
    <!-- ========================================== -->
    <div id="chat-window" class="chat-window hidden">
      <header class="chat-header">
        <img src="./socorro.png" alt="Socorro" class="chat-profile-pic">
        <span id="chat-savoy">Socorro</span>
            
        <!-- Sem botão de fechar. O chat é fixo na tela. -->
      </header>

      <div id="chat-messages" class="chat-messages">
        <div class="msg bot">
          Olá! Sou o assistente virtual.
          Posso te ajudar com:
          <ul>
            <li>📊 <strong>Consultar banco de horas</strong></li>
            <li>📦 <strong>Solicitar EPI</strong></li>
            <li>📄 <strong>Ver minhas requisições</strong></li>
          </ul>
          Digite <em>"ajuda"</em> a qualquer momento.
        </div>
      </div>

      <form id="chat-form" class="chat-form" onsubmit="return false;" >
  <input
    id="chat-input"
    type="text"
    placeholder="Digite sua mensagem..."
    autocomplete="off"
  />
  <button type="submit" class="chat-btn-send">➤</button>
</form>
    </div>

    <!-- ========================================== -->
    <!-- 3. SCRIPTS DO PROJETO                      -->
    <!-- ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    
    <script src="script.js"></script>
    <script src="colab.js"></script>
    <script src="treinamentos.js"></script>
</body>

</html>
